<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Змейка P2P</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a; color: #eee;
    font-family: system-ui, sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 10px;
    user-select: none; overflow: hidden;
  }
  h1 { color: #0f0; font-size: 20px; margin-bottom: 10px; }
  #menu {
    display: flex; flex-direction: column;
    gap: 15px; align-items: center;
    padding: 30px; background: #1a1a1a;
    border-radius: 12px; max-width: 400px; width: 100%;
  }
  #menu button {
    padding: 14px 24px; font-size: 16px;
    background: #0f0; color: #000; border: none;
    border-radius: 8px; cursor: pointer;
    font-weight: bold; width: 100%;
  }
  #menu button:hover { background: #0c0; }
  #menu button.secondary { background: #333; color: #0f0; border: 1px solid #0f0; }
  #codeInput {
    padding: 14px; font-size: 22px; text-align: center;
    background: #000; color: #0f0; border: 2px solid #0f0;
    border-radius: 8px; width: 100%; letter-spacing: 5px;
    text-transform: uppercase; font-weight: bold;
  }
  #myCode {
    font-size: 32px; color: #0f0; letter-spacing: 6px;
    font-weight: bold; padding: 15px;
    background: #000; border-radius: 8px;
    border: 2px dashed #0f0; margin: 10px 0;
    user-select: all;
  }
  #status { font-size: 14px; color: #aaa; margin-top: 10px; }
  
  #scoreboard {
    display: none; gap: 30px;
    margin-bottom: 10px; font-size: 16px; font-weight: bold;
  }
  #scoreboard.show { display: flex; }
  .score-me { color: #0f0; }
  .score-enemy { color: #08f; }
  
  canvas {
    display: none; border: 2px solid #0f0;
    border-radius: 8px; background: #111;
    max-width: 95vw; max-height: 70vh;
  }
  canvas.show { display: block; }
  
  #controls {
    margin-top: 10px;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(2, 60px);
    gap: 5px; display: none;
  }
  #controls.show { display: grid; }
  #controls button {
    background: #222; color: #0f0;
    border: 1px solid #0f0; border-radius: 8px;
    font-size: 24px; cursor: pointer;
  }
  #controls button:active { background: #0f0; color: #000; }
  .ctrl-up    { grid-column: 2; grid-row: 1; }
  .ctrl-left  { grid-column: 1; grid-row: 2; }
  .ctrl-down  { grid-column: 2; grid-row: 2; }
  .ctrl-right { grid-column: 3; grid-row: 2; }
  
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.9);
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; padding: 20px; text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 28px; margin-bottom: 15px; }
  #overlay button {
    padding: 12px 30px; font-size: 18px;
    background: #0f0; color: #000;
    border: none; border-radius: 8px;
    cursor: pointer; font-weight: bold; margin-top: 15px;
  }
</style>
</head>
<body>

<h1>🐍 Змейка P2P</h1>

<div id="menu">
  <button id="hostBtn">🎮 Создать игру (я хост)</button>
  <button id="joinBtn" class="secondary">🔗 Присоединиться</button>
  <input id="codeInput" placeholder="КОД" maxlength="6" style="display:none">
  <div id="myCode" style="display:none"></div>
  <div id="status">Выбери режим</div>
</div>

<div id="scoreboard">
  <div class="score-me">Ты: <span id="myScore">0</span></div>
  <div class="score-enemy">Враг: <span id="enemyScore">0</span></div>
</div>

<canvas id="game" width="600" height="600"></canvas>

<div id="controls">
  <button class="ctrl-up"    data-dir="up">▲</button>
  <button class="ctrl-left"  data-dir="left">◀</button>
  <button class="ctrl-down"  data-dir="down">▼</button>
  <button class="ctrl-right" data-dir="right">▶</button>
</div>

<div id="overlay">
  <h2 id="overlayTitle"></h2>
  <p id="overlayText"></p>
  <button id="overlayBtn" style="display:none">Играть снова</button>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// === КОНСТАНТЫ ===
const COLS = 30, ROWS = 30;
const CELL = 600 / COLS;
const TICK_MS = 120;

// === DOM ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const menuEl = document.getElementById('menu');
const statusEl = document.getElementById('status');
const myCodeEl = document.getElementById('myCode');
const hostBtn = document.getElementById('hostBtn');
const joinBtn = document.getElementById('joinBtn');
const codeInput = document.getElementById('codeInput');
const scoreboard = document.getElementById('scoreboard');
const myScoreEl = document.getElementById('myScore');
const enemyScoreEl = document.getElementById('enemyScore');
const controls = document.getElementById('controls');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayText = document.getElementById('overlayText');
const overlayBtn = document.getElementById('overlayBtn');

// === СОСТОЯНИЕ ===
let peer = null;
let conn = null;
let isHost = false;
let playerId = null;
let gameActive = false;
let gameLoop = null;

let mySnake = [];
let enemySnake = [];
let food = { x: 15, y: 15 };
let scores = [0, 0];
let alive = [true, true];
let dir1 = { x: 1, y: 0 };
let dir2 = { x: -1, y: 0 };
let myDir = { x: 1, y: 0 };

// === PEER.JS — настройка соединения ===
// Используем публичный сигнальный сервер PeerJS
// (нужен только на этапе рукопожатия, потом P2P напрямую)

function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

// === РЕЖИМ ХОСТА ===
hostBtn.onclick = () => {
  isHost = true;
  playerId = 1;
  const code = generateCode();
  
  statusEl.textContent = 'Создаём комнату…';
  hostBtn.style.display = 'none';
  joinBtn.style.display = 'none';
  myCodeEl.style.display = 'block';
  myCodeEl.textContent = code;
  statusEl.textContent = '👆 Скажи другу этот код';
  
  // Префикс + код, чтобы избежать коллизий с другими пользователями PeerJS
  peer = new Peer('snake-' + code, {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' }
      ]
    }
  });
  
  peer.on('open', (id) => {
    console.log('Хост готов, ID:', id);
  });
  
  peer.on('connection', (connection) => {
    conn = connection;
    setupConnection();
  });
  
  peer.on('error', (err) => {
    console.error(err);
    statusEl.textContent = '❌ Ошибка: ' + err.type;
  });
};

// === РЕЖИМ КЛИЕНТА ===
joinBtn.onclick = () => {
  joinBtn.style.display = 'none';
  hostBtn.style.display = 'none';
  codeInput.style.display = 'block';
  codeInput.focus();
  statusEl.textContent = 'Введи код друга и нажми Enter';
  
  codeInput.onkeydown = (e) => {
    if (e.key === 'Enter') {
      const code = codeInput.value.trim().toUpperCase();
      if (code.length !== 6) {
        statusEl.textContent = 'Код должен быть 6 символов';
        return;
      }
      connectToHost(code);
    }
  };
};

function connectToHost(code) {
  isHost = false;
  playerId = 2;
  
  statusEl.textContent = 'Подключаемся…';
  codeInput.disabled = true;
  
  peer = new Peer({
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:global.stun.twilio.com:3478' }
      ]
    }
  });
  
  peer.on('open', () => {
    conn = peer.connect('snake-' + code, { reliable: true });
    setupConnection();
  });
  
  peer.on('error', (err) => {
    console.error(err);
    statusEl.textContent = '❌ Не удалось подключиться. Проверь код.';
  });
}

// === ОБЩАЯ НАСТРОЙКА СОЕДИНЕНИЯ ===
function setupConnection() {
  conn.on('open', () => {
    statusEl.textContent = '✅ Соединение установлено!';
    
    if (isHost) {
      // Хост стартует игру и отправляет состояние
      newGame();
      conn.send({ type: 'start', playerId: 2 });
      startHostLoop();
    } else {
      // Клиент ждёт сообщение 'start'
      conn.send({ type: 'ready' });
    }
    
    showGameUI();
  });
  
  conn.on('data', (data) => {
    handleMessage(data);
  });
  
  conn.on('close', () => {
    statusEl.textContent = '❌ Соединение потеряно';
    endGame('Соперник отключился', '');
  });
  
  conn.on('error', (err) => {
    console.error('Ошибка соединения:', err);
  });
}

// === ОБРАБОТКА СООБЩЕНИЙ ===
function handleMessage(msg) {
  if (!msg || typeof msg !== 'object') return;
  
  switch (msg.type) {
    case 'start':
      playerId = msg.playerId;
      newGame();
      showGameUI();
      break;
    
    case 'move':
      // Только хост обрабатывает ходы клиента
      if (isHost && !isOpposite(msg.dir, dir2)) {
        dir2 = msg.dir;
      }
      break;
    
    case 'state':
      // Клиент получает состояние от хоста
      if (!isHost) {
        mySnake = msg.snake2;
        enemySnake = msg.snake1;
        food = msg.food;
        myScoreEl.textContent = msg.scores[1];
        enemyScoreEl.textContent = msg.scores[0];
        alive = msg.alive;
        
        if (!alive[0] && !alive[1]) endGame('Ничья!', '');
        else if (!alive[1]) endGame('Ты проиграл 😢', '');
        else if (!alive[0]) endGame('Ты победил! 🏆', '');
      }
      break;
    
    case 'restart':
      newGame();
      hideOverlay();
      gameActive = true;
      break;
  }
}

function isOpposite(a, b) {
  return a.x === -b.x && a.y === -b.y;
}

// === ИГРОВАЯ ЛОГИКА (выполняется ТОЛЬКО у хоста) ===
function newGame() {
  mySnake = [];  // не важно, обновится из state
  enemySnake = [];
  
  if (isHost) {
    dir1 = { x: 1, y: 0 };
    dir2 = { x: -1, y: 0 };
  }
  myDir = playerId === 1 ? dir1 : dir2;
  
  scores = [0, 0];
  alive = [true, true];
  food = spawnFood();
  gameActive = true;
  
  // Инициализируем змейки на клиенте тоже
  const snake1 = [{ x: 5, y: 15 }, { x: 4, y: 15 }, { x: 3, y: 15 }];
  const snake2 = [{ x: 24, y: 15 }, { x: 25, y: 15 }, { x: 26, y: 15 }];
  
  if (playerId === 1) {
    mySnake = snake1;
    enemySnake = snake2;
  } else {
    mySnake = snake2;
    enemySnake = snake1;
  }
  
  hideOverlay();
}

function startHostLoop() {
  let snake1 = [{ x: 5, y: 15 }, { x: 4, y: 15 }, { x: 3, y: 15 }];
  let snake2 = [{ x: 24, y: 15 }, { x: 25, y: 15 }, { x: 26, y: 15 }];
  let hostDir1 = { x: 1, y: 0 };
  let hostDir2 = { x: -1, y: 0 };
  let hostFood = spawnFood();
  let hostScores = [0, 0];
  let hostAlive = [true, true];
  
  // Синхронизируем с глобальными переменными хоста
  window._hostState = {
    snake1, snake2,
    dir1: hostDir1, dir2: hostDir2,
    food: hostFood,
    scores: hostScores,
    alive: hostAlive
  };
  
  // Перехватываем движение хоста
  window._sendHostDir = (dir) => {
    hostDir1 = dir;
    window._hostState.dir1 = dir;
  };
  
  if (gameLoop) clearInterval(gameLoop);
  
  gameLoop = setInterval(() => {
    if (!gameActive) return;
    
    const state = window._hostState;
    
    // Двигаем змейки
    if (state.alive[0]) moveSnake(state.snake1, state.dir1);
    if (state.alive[1]) moveSnake(state.snake2, state.dir2);
    
    // Столкновения
    if (state.alive[0] && outOfBounds(state.snake1[0])) state.alive[0] = false;
    if (state.alive[1] && outOfBounds(state.snake2[0])) state.alive[1] = false;
    if (state.alive[0] && hitsSelf(state.snake1)) state.alive[0] = false;
    if (state.alive[1] && hitsSelf(state.snake2)) state.alive[1] = false;
    
    // Змейки друг с другом
    if (state.alive[0] && state.alive[1]) {
      if (samePos(state.snake1[0], state.snake2[0])) {
        state.alive[0] = false; state.alive[1] = false;
      }
      if (state.snake1.slice(1).some(s => samePos(s, state.snake2[0]))) {
        state.alive[1] = false;
      }
      if (state.snake2.slice(1).some(s => samePos(s, state.snake1[0]))) {
        state.alive[0] = false;
      }
    }
    
    // Еда
    if (state.alive[0] && samePos(state.snake1[0], state.food)) {
      state.scores[0]++;
      state.snake1.push({ ...state.snake1[state.snake1.length - 1] });
      state.food = spawnFood();
      window._hostState.food = state.food;
    }
    if (state.alive[1] && samePos(state.snake2[0], state.food)) {
      state.scores[1]++;
      state.snake2.push({ ...state.snake2[state.snake2.length - 1] });
      state.food = spawnFood();
      window._hostState.food = state.food;
    }
    
    // Обновляем свой вид
    mySnake = state.snake1;
    enemySnake = state.snake2;
    food = state.food;
    myScoreEl.textContent = state.scores[0];
    enemyScoreEl.textContent = state.scores[1];
    
    // Проверка конца
    if (!state.alive[0] && !state.alive[1]) endGame('Ничья!', '');
    else if (!state.alive[0]) endGame('Ты проиграл 😢', '');
    else if (!state.alive[1]) endGame('Ты победил! 🏆', '');
    
    // Отправляем состояние клиенту
    if (conn && conn.open) {
      conn.send({
        type: 'state',
        snake1: state.snake1,
        snake2: state.snake2,
        food: state.food,
        scores: state.scores,
        alive: state.alive
      });
    }
  }, TICK_MS);
}

function moveSnake(snake, dir) {
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  snake.unshift(head);
  snake.pop();
}

function spawnFood() {
  return {
    x: Math.floor(Math.random() * COLS),
    y: Math.floor(Math.random() * ROWS),
  };
}

function outOfBounds(p) {
  return p.x < 0 || p.x >= COLS || p.y < 0 || p.y >= ROWS;
}

function hitsSelf(snake) {
  const [head, ...body] = snake;
  return body.some(s => samePos(s, head));
}

function samePos(a, b) {
  return a.x === b.x && a.y === b.y;
}

// === УПРАВЛЕНИЕ ===
const DIRS = {
  up:    { x: 0, y: -1 },
  down:  { x: 0, y: 1 },
  left:  { x: -1, y: 0 },
  right: { x: 1, y: 0 },
};

function sendDir(dir) {
  if (!gameActive) return;
  if (dir.x === -myDir.x && dir.y === -myDir.y) return;
  myDir = dir;
  
  if (isHost) {
    window._sendHostDir(dir);
  } else {
    if (conn && conn.open) {
      conn.send({ type: 'move', dir });
    }
  }
}

document.addEventListener('keydown', (e) => {
  const map = {
    ArrowUp: DIRS.up, ArrowDown: DIRS.down,
    ArrowLeft: DIRS.left, ArrowRight: DIRS.right,
    w: DIRS.up, s: DIRS.down, a: DIRS.left, d: DIRS.right,
    ц: DIRS.up, ы: DIRS.down, ф: DIRS.left, в: DIRS.right,
    W: DIRS.up, S: DIRS.down, A: DIRS.left, D: DIRS.right,
  };
  if (map[e.key]) {
    e.preventDefault();
    sendDir(map[e.key]);
  }
});

document.querySelectorAll('#controls button').forEach(btn => {
  btn.addEventListener('click', () => sendDir(DIRS[btn.dataset.dir]));
});

overlayBtn.onclick = () => {
  if (isHost) {
    // Хост перезапускает игру и рассылает всем
    newGame();
    startHostLoop();
    hideOverlay();
    if (conn && conn.open) conn.send({ type: 'restart' });
  } else {
    // Клиент просит хоста перезапустить
    if (conn && conn.open) conn.send({ type: 'restart_request' });
  }
};

// === UI ===
function showGameUI() {
  menuEl.style.display = 'none';
  canvas.classList.add('show');
  scoreboard.classList.add('show');
  controls.classList.add('show');
  statusEl.style.display = 'none';
}

function endGame(title, text) {
  if (!gameActive) return;
  gameActive = false;
  showOverlay(title, text, true);
}

function showOverlay(title, text, showBtn = false) {
  overlayTitle.textContent = title;
  overlayText.textContent = text;
  overlayBtn.style.display = showBtn ? 'inline-block' : 'none';
  overlay.classList.add('show');
}

function hideOverlay() {
  overlay.classList.remove('show');
}

// === ОТРИСОВКА ===
function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 1;
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath();
    ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height);
    ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL);
    ctx.stroke();
  }
  
  ctx.fillStyle = '#f33';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#f33';
  ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
  ctx.shadowBlur = 0;
  
  drawSnake(mySnake, '#0f0', '#0a0');
  drawSnake(enemySnake, '#08f', '#046');
  
  requestAnimationFrame(draw);
}

function drawSnake(snake, headColor, bodyColor) {
  if (!snake || snake.length === 0) return;
  snake.forEach((seg, i) => {
    ctx.fillStyle = i === 0 ? headColor : bodyColor;
    const pad = i === 0 ? 1 : 2;
    ctx.fillRect(
      seg.x * CELL + pad, seg.y * CELL + pad,
      CELL - pad * 2, CELL - pad * 2
    );
  });
}

// === СТАРТ ===
draw();
</script>
</body>
</html>
