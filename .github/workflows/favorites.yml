name: Create Favorites Playlist

on:
  workflow_dispatch:

jobs:
  favorites:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run create_favorites.py
        run: |
          python create_favorites.py
      
      - name: Check if favorites.m3u changed
        id: check_changes
        run: |
          # Проверяем изменения
          if git diff --quiet HEAD -- output/favorites.m3u output/epg.xml; then
            echo "✅ Нет изменений"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "🔄 Изменения обнаружены"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/favorites.m3u output/epg.xml
          git commit -m "Auto update favorites playlist $(date -d '+3 hours' '+%Y-%m-%d %H:%M:%S')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Skip (нет изменений)
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "⏭️ Пропускаем коммит (нет изменений)"