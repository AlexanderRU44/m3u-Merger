name: Create Favorites Playlist

on:
  workflow_dispatch:
  push:
    paths:
      - 'create_favorites.py'
      - 'favorites_rules.json'
  schedule:
    - cron: '0 */6 * * *'

jobs:
  favorites:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run create_favorites.py
        run: |
          python create_favorites.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/favorites.m3u output/epg.xml
          git diff --staged --quiet || git commit -m "Auto update favorites playlist"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}