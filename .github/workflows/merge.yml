name: Merge Playlists

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths:
      - 'playlists/**'
      - 'download_playlists.py'
      - 'merge_m3u.py'
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run merge
        run: |
          python download_playlists.py
          python merge_m3u.py
      
      - name: Check if merged.m3u changed
        id: check_changes
        run: |
          git add output/merged.m3u playlists/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Нет изменений в merged.m3u"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "🔄 merged.m3u изменён"
            if [ -f output/merged.m3u ]; then
              TOTAL=$(grep -c "^#EXTINF" output/merged.m3u || echo "0")
              echo "total_channels=$TOTAL" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Set date and time (MSK)
        id: datetime
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          MSK_DATE=$(date -d "+3 hours" '+%Y-%m-%d %H:%M:%S')
          MSK_DATE_SHORT=$(date -d "+3 hours" '+%Y-%m-%d')
          echo "date=$MSK_DATE" >> $GITHUB_OUTPUT
          echo "date_short=$MSK_DATE_SHORT" >> $GITHUB_OUTPUT
      
      - name: Commit and push merged.m3u (если есть изменения)
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto update merged playlist - ${{ steps.datetime.outputs.date }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Release with info
        if: steps.check_changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "📺 Плейлист обновлён — ${{ steps.datetime.outputs.date_short }}"
          body: |
            ## 🔄 Обновление merged.m3u
            
            **Дата:** ${{ steps.datetime.outputs.date }} MSK
            
            ### 📊 Статистика:
            - **Всего каналов:** ${{ steps.check_changes.outputs.total_channels || 'N/A' }}
            
            ### 📁 Файлы:
            - `merged.m3u` — основной плейлист
            
            ---
            *Автоматическое обновление*
          files: |
            output/merged.m3u
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Skip release (нет изменений)
        if: steps.check_changes.outputs.changed == 'false'
        run: |
          echo "⏭️ Пропускаем обновление релиза (нет изменений)"