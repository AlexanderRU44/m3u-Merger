name: Create Release

on:
  push:
    paths:
      - 'output/merged.m3u'
      - 'output/favorites.m3u'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current date for release name
        id: release_date
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Get file modification dates
        id: dates
        run: |
          # Получаем дату последнего изменения merged.m3u из git log с follow
          MERGED_DATE=$(git log -1 --format="%cd" --date=format:"%Y-%m-%d %H:%M:%S" -- output/merged.m3u || echo "неизвестно")
          FAVORITES_DATE=$(git log -1 --format="%cd" --date=format:"%Y-%m-%d %H:%M:%S" -- output/favorites.m3u || echo "неизвестно")
          
          # Проверяем, есть ли незакоммиченные изменения в файлах
          if git diff --name-only | grep -q "output/merged.m3u"; then
            MERGED_DATE="$(date +'%Y-%m-%d %H:%M:%S') (текущие изменения)"
          fi
          if git diff --name-only | grep -q "output/favorites.m3u"; then
            FAVORITES_DATE="$(date +'%Y-%m-%d %H:%M:%S') (текущие изменения)"
          fi
          
          echo "MERGED_DATE=$MERGED_DATE" >> $GITHUB_OUTPUT
          echo "FAVORITES_DATE=$FAVORITES_DATE" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: "📡 Плейлисты от ${{ steps.release_date.outputs.RELEASE_DATE }}"
          tag_name: "v${{ github.run_number }}"
          body: |
            🔄 Обновление плейлистов
            
            📅 merged.m3u: ${{ steps.dates.outputs.MERGED_DATE }} MSK
            📅 favorites.m3u: ${{ steps.dates.outputs.FAVORITES_DATE }} MSK
            
            📁 Файлы приложены ниже.
          files: |
            output/merged.m3u
            output/favorites.m3u
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}