name: Merge M3U Playlists

on:
  push:
    paths:
      - 'playlists/**'
      - 'download_playlists.py'
      - 'merge_m3u.py'
    branches:
      - main
      - master
  
  workflow_dispatch:
    inputs:
      keep_duplicates:
        description: 'Оставить дубликаты?'
        type: boolean
        default: false
      sort_channels:
        description: 'Сортировать каналы?'
        type: boolean
        default: true

  schedule:
    - cron: '10 18 * * *'

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install requests
          pip install -r requirements.txt || true
      
      - name: Download playlists from URLs
        run: python download_playlists.py
      
      - name: Check downloaded playlists
        run: |
          echo "Contents of playlists/:"
          ls -la playlists/
      
      - name: Merge playlists
        id: merge
        run: |
          KEEP_DUPS="${{ github.event.inputs.keep_duplicates || false }}"
          SORT="${{ github.event.inputs.sort_channels || true }}"
          
          ARGS=""
          if [ "$KEEP_DUPS" = "true" ]; then
            ARGS="$ARGS --keep-duplicates"
          fi
          if [ "$SORT" = "true" ]; then
            ARGS="$ARGS --sort"
          fi
          
          python merge_m3u.py --input-dir ./playlists --output ./output/merged.m3u $ARGS --generate-stats
      
      - name: Show statistics
        if: success()
        run: |
          if [ -f output/stats.json ]; then
            cat output/stats.json
          else
            echo "No stats file"
          fi
      
      - name: Commit and push
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add -f playlists/ output/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update playlists $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main || true
            git push origin main
          fi
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-playlist
          path: output/merged.m3u
          retention-days: 30
      
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Current Playlist"
          body: |
            ## Updated Playlist
            
            **Date:** $(date '+%Y-%m-%d %H:%M:%S') MSK
            
            ### Links
            
            **Main playlist:**
            https://raw.githubusercontent.com/${{ github.repository }}/main/output/merged.m3u
            
            **Archive playlist:**
            https://raw.githubusercontent.com/${{ github.repository }}/main/output/merged_archive.m3u
            
            ### Files
            - merged.m3u - main playlist
            - merged_archive.m3u - archive channels only
            - stats.json - statistics
          files: |
            output/merged.m3u
            output/merged_archive.m3u
            output/stats.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
