name: Merge M3U Playlists

on:
  push:
    paths:
      - 'playlists/**'
      - 'download_playlists.py'  # Добавляем триггер на изменение скрипта
    branches:
      - main
      - master
  
  workflow_dispatch:
    inputs:
      keep_duplicates:
        description: 'Оставить дубликаты?'
        type: boolean
        default: false
      sort_channels:
        description: 'Сортировать каналы?'
        type: boolean
        default: true

  schedule:
    - cron: '0 3 * * *'  # Каждый день в 3:00

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install requests  # Добавляем requests
          pip install -r requirements.txt || true
      
      - name: 📥 Download playlists from URLs
        run: |
          echo "📥 Скачивание плейлистов по ссылкам..."
          python download_playlists.py
      
      - name: 🔍 Check downloaded playlists
        run: |
          echo "📂 Содержимое playlists/:"
          ls -la playlists/
          echo ""
          echo "📄 Проверка первого файла:"
          head -n 5 playlists/*.m3u 2>/dev/null || echo "Нет .m3u файлов"
          head -n 5 playlists/*.m3u8 2>/dev/null || echo "Нет .m3u8 файлов"
      
      - name: 🔄 Merge playlists
        id: merge
        run: |
          KEEP_DUPS="${{ github.event.inputs.keep_duplicates || false }}"
          SORT="${{ github.event.inputs.sort_channels || true }}"
          
          ARGS=""
          if [ "$KEEP_DUPS" = "true" ]; then
            ARGS="$ARGS --keep-duplicates"
          fi
          if [ "$SORT" = "true" ]; then
            ARGS="$ARGS --sort"
          fi
          
          python merge_m3u.py --input-dir ./playlists --output ./output/merged.m3u $ARGS --generate-stats
          
          echo "status=success" >> $GITHUB_OUTPUT
      
      - name: 📊 Show statistics
        if: success()
        run: |
          echo "📊 Статистика:"
          cat output/stats.json || echo "Нет статистики"
          echo ""
          echo "📄 Содержимое merged.m3u (первые 10 строк):"
          head -n 10 output/merged.m3u || echo "Файл пуст"
      
      - name: 📝 Commit and push
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add playlists/ output/
          
          if git diff --staged --quiet; then
            echo "✅ Нет изменений для коммита"
          else
            git commit -m "🔄 Автоматическое обновление плейлистов $(date '+%Y-%m-%d %H:%M')"
            git push
            echo "✅ Изменения запушены в репозиторий"
          fi
      
      - name: 📎 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: merged-playlist
          path: output/merged.m3u
          retention-days: 30
      
      - name: 📋 Create/Update release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Последняя версия плейлиста"
          body: |
            ## 📺 Объединенный плейлист
            
            📅 Обновлено: $(date '+%Y-%m-%d %H:%M:%S')
            
            ### 📊 Статистика
            ```json
            $(cat output/stats.json 2>/dev/null || echo "Нет данных")
