name: Merge M3U Playlists

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '20 18 * * *'

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install requests
      
      - run: python download_playlists.py
      
      - run: python merge_m3u.py --input-dir ./playlists --output ./output/merged.m3u --generate-stats
      
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f playlists/ output/
          git diff --staged --quiet || (git commit -m "Update playlists" && git push)
      
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: output/merged.m3u
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
