name: Merge M3U Playlists

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '35 18 * * *'

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - run: pip install requests
      
      - run: python download_playlists.py
      
      - run: python merge_m3u.py --input-dir ./playlists --output ./output/merged.m3u --generate-stats
      
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f playlists/ output/
          git diff --staged --quiet || git commit -m "Auto update"
          git push
      
      # ⬇️ ЭТОТ ШАГ РЕШАЕТ ПРОБЛЕМУ ⬇️
      - name: Delete old latest release
        run: |
          gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Playlist
          files: output/merged.m3u
